name: Deploy AgriManage to cPanel (avinia.ir)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy .htaccess to dist
        run: cp .htaccess dist/.htaccess || true

      - name: Sync / Deploy to cPanel via FTP (Addon Domain avinia.ir)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }} # e.g. ftp.avinia.ir or server IP
          username: ${{ secrets.CPANEL_FTP_USERNAME }} # e.g. cpanel_user or dedicated FTP account for avinia.ir
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          # Deploy specifically to avinia.ir document root (NOT root public_html to preserve other sites)
          server-dir: /public_html/avinia.ir/
